name: Build and Push Docker Image

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-push:
    name: Build & Publish
    runs-on: ubuntu-latest
    
    # Optional: If you are using GitHub Environments, uncomment the line below and match your environment name
    # environment: production

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx (highly recommended for modern Docker builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Authenticate with the Container Registry
      # This block resolves the 'Error: Password required' by securely pulling from GitHub Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.udith47 }}
          password: ${{ secrets.dckr_pat_xrpjqsXdh6EeimnpBubRwCY26mc }}
          logout: true

      # Step 4: Build and Push the Docker Image
      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }} # Only pushes on actual branch commits, not PRs from forks
          tags: |
            ${{ secrets.udith47 }}/my-app:latest
            ${{ secrets.udith47 }}/my-app:${{ github.sha }}




